<!doctype html>
<html lang="{{ page.lang | default: site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% include seo.html %}
  {% include book-head.html %}
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  {% include masthead.html %}
  <main id="main" class="wrap reference-document">
    {% unless content contains '<h1' %}<h1>{{ page.title | escape }}</h1>{% endunless %}
    {{ content | replace: '<pre>', '<pre tabindex="0">' | replace: '<pre class="highlight">', '<pre class="highlight" tabindex="0">' }}
  </main>
</body>
</html>
