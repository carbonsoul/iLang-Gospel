<meta name="color-scheme" content="light dark">
<link rel="icon" href="{{ '/assets/bookmark.svg' | relative_url }}" type="image/svg+xml">
<script>
  try {
    const theme = localStorage.getItem('gospel-theme');
    if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
  } catch {}
</script>
{% unless page.code_document %}<link rel="preload" href="{{ '/assets/tufte/roman.woff' | relative_url }}" as="font" type="font/woff" crossorigin>{% endunless %}
<link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
<script defer src="{{ '/assets/theme.js' | relative_url }}"></script>
